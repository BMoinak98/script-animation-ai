<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Production Portal</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
          --bg: #0f172a;
          --card-bg: #1e293b;
          --text: #f8fafc;
          --muted: #94a3b8;
          --primary: #38bdf8;
          --primary-hover: #0284c7;
          --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: var(--bg);
          color: var(--text);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }

        .card {
          background-color: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 32px;
          width: 100%;
          max-width: 480px;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 600; }
        p.subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }

        .user-badge {
          background: #090d16;
          border: 1px solid var(--border);
          padding: 10px 14px;
          border-radius: 8px;
          font-size: 0.85rem;
          margin-bottom: 20px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--muted); }

        select, input[type="url"] {
          width: 100%;
          padding: 10px 12px;
          background: #0f172a;
          border: 1px solid var(--border);
          border-radius: 6px;
          color: var(--text);
          font-size: 0.95rem;
          outline: none;
        }
        select:focus, input[type="url"]:focus { border-color: var(--primary); }

        button.btn-submit {
          width: 100%;
          padding: 12px;
          background-color: var(--primary);
          color: #0f172a;
          border: none;
          border-radius: 6px;
          font-weight: 600;
          font-size: 0.95rem;
          cursor: pointer;
          transition: background 0.2s ease;
        }
        button.btn-submit:hover { background-color: var(--primary-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #statusMessage {
          margin-top: 16px;
          font-size: 0.85rem;
          text-align: center;
          display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Pipeline Request</h1>
    <p class="subtitle">Authenticate with Google to submit generation tasks.</p>

    <div id="authSection">
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="dark" data-width="100%"></div>
    </div>

    <div id="formSection" style="display: none;">
        <div class="user-badge">
            <span>Logged in as: <b id="userEmail"></b></span>
        </div>

        <form id="pipelineForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="choice">Pipeline Mode</label>
                <select id="choice" required>
                    <option value="audio">Audio / Transcribe Only</option>
                    <option value="video">Full Video Generation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fileUrl">Source File URL (Google Drive / Direct Link)</label>
                <input type="url" id="fileUrl" placeholder="https://..." required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Submit Pipeline Job</button>
        </form>
        <div id="statusMessage"></div>
    </div>
</div>

<script>
    // Configuration
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJY35rkPAtbSEsdTAQ9NxxvmAjuh3Cdxnl_pYRgNQWHUJMGWc451GHNIlfIWiK3DoLmg/exec";
    let googleIdToken = null;

    // Called automatically by Google SDK upon successful sign in
    function handleCredentialResponse(response) {
      googleIdToken = response.credential; // Signed JWT token from Google

      // Extract user email from JWT token payload to render on UI
      const payload = JSON.parse(atob(googleIdToken.split('.')[1]));
      document.getElementById("userEmail").innerText = payload.email;

      // Swap Auth button for Form UI
      document.getElementById("authSection").style.display = "none";
      document.getElementById("formSection").style.display = "block";
    }

    async function submitForm(e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      const statusMsg = document.getElementById("statusMessage");

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMsg.style.display = "block";
      statusMsg.style.color = "#94a3b8";
      statusMsg.innerText = "Processing request...";

      const payload = {
        id_token: googleIdToken,
        choice: document.getElementById("choice").value,
        file_url: document.getElementById("fileUrl").value
      };

      try {
        // Mode 'no-cors' is required due to Google Apps Script HTTP redirect response behavior
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        statusMsg.style.color = "#4ade80";
        statusMsg.innerText = "Request submitted successfully! Check your email for status updates.";
        document.getElementById("fileUrl").value = "";
      } catch (err) {
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "Submission failed: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Pipeline Job";
      }
    }
</script>
</body>
</html>

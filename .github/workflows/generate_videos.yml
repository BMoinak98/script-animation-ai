name: Generate Script Animation Video

on:
  repository_dispatch:
    types: [process_script]

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Animation Pipeline
        env:
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          SCRIPT_TEXT: ${{ github.event.client_payload.script_text }}
          LANGUAGE: ${{ github.event.client_payload.language }}
          VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/main.py

      - name: Send Email via Google Apps Script Webhook
        if: success()
        run: |
          curl -L -X POST -H "Content-Type: application/json" \
          -d "{\"user_email\": \"${{ github.event.client_payload.user_email }}\", \"video_link\": \"${{ env.VIDEO_URL }}\"}" \
          "${{ secrets.GAS_WEBHOOK_URL }}"
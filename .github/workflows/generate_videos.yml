name: Generate Script Animation Video

on:
  repository_dispatch:
    types: [process_script]

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Kokoro Model Files
        run: |
          curl -LO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/kokoro-v0_19.onnx
          curl -LO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/voices.bin

      - name: Execute Animation Pipeline
        env:
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          SCRIPT_TEXT: ${{ github.event.client_payload.script_text }}
          LANGUAGE: ${{ github.event.client_payload.language }}
          VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
          PIPELINE_MODE: ${{ github.event.client_payload.pipeline_mode }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/main.py

      - name: Send Artifact Links via Google Apps Script Webhook
        if: success()
        run: |
          curl -L -X POST -H "Content-Type: application/json" \
          -d "{\"action_complete\": true, \"user_email\": \"${{ github.event.client_payload.user_email }}\", \"audio_url\": \"${{ env.AUDIO_URL }}\", \"transcript_url\": \"${{ env.TRANSCRIPT_URL }}\", \"video_url\": \"${{ env.VIDEO_URL }}\"}" \
          "${{ secrets.GAS_WEBHOOK_URL }}"